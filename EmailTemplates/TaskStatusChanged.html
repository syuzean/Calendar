<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f5f3f7;color:#17151f;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f3f7"><tr><td align="center" style="padding:32px 14px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:580px;background:#fff;border:1px solid #e8e4ed;border-radius:18px;overflow:hidden">
      <tr><td style="padding:24px 28px;background:#211937;color:#fff"><table role="presentation" width="100%"><tr><td style="font-size:20px;font-weight:700">LUMA <span style="color:#c7b9ff">Tasks</span></td><td align="right" style="font-size:12px;color:#d8d0e7">{{SubjectLabel}}</td></tr></table></td></tr>
      <tr><td style="padding:30px 28px 10px"><p style="margin:0 0 8px;font-size:15px;color:#5f5966">Hi {{RecipientName}},</p><p style="margin:0;font-size:17px;line-height:1.5">{{ActionText}}</p></td></tr>
      <tr><td style="padding:18px 28px"><table role="presentation" width="100%" style="border:1px solid #dcebe4;border-left:6px solid #38a878;border-radius:13px"><tr><td style="padding:22px">
        <h1 style="margin:0 0 18px;font-size:24px;line-height:1.25">{{TaskTitle}}</h1>
        <table role="presentation" width="100%" style="font-size:14px;line-height:1.55;color:#5f5966"><tr><td width="115" style="padding:4px 0;font-weight:700;color:#2d2933">Task Doer</td><td>{{TaskDoer}}</td></tr><tr><td width="115" style="padding:4px 0;font-weight:700;color:#2d2933">Previous status</td><td>{{PreviousStatus}}</td></tr><tr><td width="115" style="padding:4px 0;font-weight:700;color:#2d2933">New status</td><td style="color:#287554;font-weight:700">{{NewStatus}}</td></tr><tr><td width="115" style="padding:4px 0;font-weight:700;color:#2d2933">Deadline</td><td>{{Deadline}}</td></tr></table>
      </td></tr></table></td></tr>
      <tr><td align="center" style="padding:10px 28px 32px"><a href="{{TaskUrl}}" style="display:inline-block;padding:13px 24px;border-radius:10px;background:#6f4bf2;color:#fff;text-decoration:none;font-size:15px;font-weight:700">Open task in LUMA</a></td></tr>
      <tr><td style="padding:18px 28px;background:#faf9fb;border-top:1px solid #eeeaf1;font-size:11px;color:#8d8794">This task notification was sent to {{RecipientEmail}}.</td></tr>
    </table>
  </td></tr></table>
</body>
</html>
